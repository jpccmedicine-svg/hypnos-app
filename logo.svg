<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" role="img" aria-label="HYPNOS">
  <!-- Monograma H arquitectónico con trazo dorado entrelazado -->
  <g class="hypnos-emblem" transform="translate(4, 2)">
    <!-- Capitel pilar izquierdo -->
    <rect x="6" y="6" width="22" height="4.5" rx="1" fill="#0F2D57"/>
    <rect x="9" y="10.5" width="16" height="2" fill="#0F2D57"/>
    <!-- Fuste pilar izquierdo -->
    <rect x="12" y="12" width="10" height="36" fill="#0F2D57"/>
    <!-- Base pilar izquierdo -->
    <rect x="9" y="47.5" width="16" height="2" fill="#0F2D57"/>
    <rect x="6" y="49.5" width="22" height="4.5" rx="1" fill="#0F2D57"/>

    <!-- Capitel pilar derecho -->
    <rect x="36" y="6" width="22" height="4.5" rx="1" fill="#0F2D57"/>
    <rect x="39" y="10.5" width="16" height="2" fill="#0F2D57"/>
    <!-- Fuste pilar derecho -->
    <rect x="42" y="12" width="10" height="36" fill="#0F2D57"/>
    <!-- Base pilar derecho -->
    <rect x="39" y="47.5" width="16" height="2" fill="#0F2D57"/>
    <rect x="36" y="49.5" width="22" height="4.5" rx="1" fill="#0F2D57"/>

    <!-- Cinta / lazo curvo dorado entrelazado que forma el travesaño de la H -->
    <!-- Segmento posterior (detrás del fuste derecho) -->
    <path d="M 32 30 C 37 28 42 27 48 30 C 53 33 55 38 52 44 C 49 48 43 49 39 46"
          stroke="#C9A962" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Redibujado del fuste derecho para profundidad visual (la cinta pasa por detrás) -->
    <rect x="42" y="18" width="10" height="26" fill="#0F2D57"/>

    <!-- Segmento frontal (cruza por delante del fuste izquierdo y forma el arco central) -->
    <path d="M 10 44 C 7 38 9 32 14 27 C 19 23 25 24 33 30 C 38 34 43 36 49 34"
          stroke="#C9A962" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Tipografía técnica HYPNOS (mayúsculas geométricas espaciadas del modelo 09) -->
  <g class="hypnos-wordmark" fill="#0F2D57" transform="translate(82, 17)">
    <!-- H -->
    <path d="M 0 0 L 5.5 0 L 5.5 11 L 18.5 11 L 18.5 0 L 24 0 L 24 26 L 18.5 26 L 18.5 16 L 5.5 16 L 5.5 26 L 0 26 Z"/>

    <!-- Y -->
    <path d="M 33 0 L 39 0 L 45 11 L 51 0 L 57 0 L 48 15 L 48 26 L 42 26 L 42 15 Z"/>

    <!-- P -->
    <path d="M 66 0 L 81 0 C 87 0 90.5 3.5 90.5 8.5 C 90.5 13.5 87 17 81 17 L 71.5 17 L 71.5 26 L 66 26 Z M 71.5 5 L 71.5 12 L 80 C 83 12 85 10.5 85 8.5 C 85 6.5 83 5 80 5 Z"/>

    <!-- N -->
    <path d="M 100 0 L 105.5 0 L 118.5 18 L 118.5 0 L 124 0 L 124 26 L 118.5 26 L 105.5 8 L 105.5 26 L 100 26 Z"/>

    <!-- O -->
    <path d="M 139 0 L 157 0 C 163 0 167 4 167 10 L 167 16 C 167 22 163 26 157 26 L 139 26 C 133 26 129 22 129 16 L 129 10 C 129 4 133 0 139 0 Z M 139 5 C 136.5 5 134.5 7 134.5 10 L 134.5 16 C 134.5 19 136.5 21 139 21 L 157 21 C 159.5 21 161.5 19 161.5 16 L 161.5 10 C 161.5 7 159.5 5 157 5 Z"/>

    <!-- S -->
    <path d="M 178 0 L 195 0 C 200.5 0 204 3.5 204 8 L 198.5 8 C 198.5 5.5 196.5 4.8 194.5 4.8 L 179 4.8 C 176.5 4.8 175 6 175 7.8 C 175 9.8 177 10.8 181 11.5 L 191 13.5 C 198 15 204 18 204 22 C 204 26.5 199.5 29.5 194 29.5 L 176.5 29.5 C 171 29.5 167 26 167 21 L 172.5 21 C 172.5 24 174.5 25 177 25 L 193.5 25 C 196.5 25 198 23.8 198 22 C 198 20 196 19 191.5 18 L 181.5 16 C 175 14.5 169.5 12 169.5 7.5 C 169.5 3 173.5 0 178 0 Z"/>
  </g>
</svg>
